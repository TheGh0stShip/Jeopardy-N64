name: regenerate verified data report
on:
  push:
    branches: [main]
    paths: ["tools/generate_tracker_progress.py"]
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Regenerate and commit report
        run: |
          set -euo pipefail
          python tools/generate_tracker_progress.py
          python tools/generate_tracker_progress.py --check
          git rm .github/workflows/regenerate-data-report.yml
          git add build/report.json decomphub.progress.json
          git config user.name "TheGh0stShip"
          git config user.email "TheGh0stShip@users.noreply.github.com"
          git commit -m "Generate source-owned data progress report"
          git push origin HEAD:main
