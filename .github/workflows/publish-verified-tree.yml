name: publish verified Jeopardy tree
on:
  push:
    branches: [main]
    paths: [".github/publish/jeopardy-tree.tar.gz"]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify and install committed tree
        shell: bash
        run: |
          set -euo pipefail
          echo "4eb1337a303ca06e8aac26b349388723fd757c778f1155f325ff26784267bcb3  .github/publish/jeopardy-tree.tar.gz" | sha256sum -c -
          mkdir -p /tmp/jeopardy-tree
          tar -xzf .github/publish/jeopardy-tree.tar.gz -C /tmp/jeopardy-tree
          git rm -r .
          cp -a /tmp/jeopardy-tree/. .
          git add -A
          git config user.name "TheGh0stShip"
          git config user.email "TheGh0stShip@users.noreply.github.com"
          git commit -m "Complete byte-identical Jeopardy source reconstruction"
          git push origin HEAD:main
