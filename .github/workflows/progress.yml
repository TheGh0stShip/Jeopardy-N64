name: decompilation progress
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate manifests and tracker reports
        run: |
          python tools/check_source_quality.py
          python tools/generate_tracker_progress.py --check
          python -m compileall -q tools
      - name: Upload ByteMatch progress
        uses: actions/upload-artifact@v6
        with:
          name: usa-catalogued_report
          path: build/report.json
          if-no-files-found: error
      - name: Upload scoped progress
        uses: actions/upload-artifact@v6
        with:
          name: jeopardy-usa-scoped-progress
          path: decomphub.progress.json
          if-no-files-found: error
      - name: Notify DecompHub
        if: github.event_name != 'pull_request'
        env:
          REPOSITORY: https://github.com/${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          jq -n --arg repository "$REPOSITORY" --arg revision "$REVISION" \
            '{repository: $repository, revision: $revision}' > refresh.json
          status=$(curl -sS --max-time 20 -o refresh-response.json -w '%{http_code}' \
            -H 'Content-Type: application/json' --data-binary @refresh.json \
            https://app.decomphub.com/api/progress/refresh) || status=000
          case "$status" in
            2??) echo "DecompHub accepted the refresh request." ;;
            *) echo "::warning::DecompHub refresh returned HTTP $status; GitHub artifacts are available." ;;
          esac

